apiVersion: v1
kind: ConfigMap
metadata:
  name: bankapp-nginx
  namespace: staging
data:
  default.conf: |
    server {
      listen 80;
      location / {
        proxy_pass http://bankapp:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankapp-nginx
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bankapp-nginx
  template:
    metadata:
      labels:
        app: bankapp-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: conf
        configMap:
          name: bankapp-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: bankapp-nginx
  namespace: staging
spec:
  type: NodePort
  selector:
    app: bankapp-nginx
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
