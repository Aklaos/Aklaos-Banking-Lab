apiVersion: apps/v1
kind: Deployment
metadata:
  name: testapp
  namespace: staging
spec:
  replicas: 3
  selector:
    matchLabels:
      app: testapp
  template:
    metadata:
      labels:
        app: testapp
    spec:
      containers:
      - name: testapp
        image: busybox:1.37
        command: ["sh", "-c", "sleep 3600"]
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
