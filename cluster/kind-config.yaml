# Cluster kind : 1 control-plane + 2 workers.
# Les ports 8080/8443 de l'hôte sont mappés sur le premier worker
# (NodePort 30080/30443) pour atteindre plus tard la Gateway Envoy.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080  # peut entrer en conflit avec un autre projet : changer ici
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
  - role: worker
